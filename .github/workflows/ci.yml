name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tailwind CSS is up to date with the markup
        run: |
          npm run build:css
          git diff --exit-code -- assets/css/tailwind.css || {
            echo "::error::assets/css/tailwind.css is stale — run 'npm run build:css' and commit the result."
            exit 1
          }
      - name: JavaScript parses
        run: |
          node --check assets/js/main.js
          node --check assets/js/theme-init.js
          node --check scripts/fetch-articles.mjs
      - name: articles.json is valid
        run: node -e "const d=require('./assets/data/articles.json'); if(!Array.isArray(d.items)) process.exit(1)"

name: Refresh Medium articles

on:
  schedule:
    - cron: '17 5 * * *' # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-articles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot feed
        run: node scripts/fetch-articles.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/articles.json; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/articles.json
          git commit -m "chore: refresh Medium articles snapshot"
          git push
